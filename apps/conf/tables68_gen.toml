# Paper Table 6 (diagnosis position) + Table 8 (cognitive-load metrics)
# Usage: python -m apps.results_table_gen apps/conf/tables68_gen.toml
#
# Section names below are internal and predate the final paper numbering:
#   [table8] -> paper Table 6  (position of MSD's diagnosis in HSD's enumeration)
#   [table9] -> paper Table 8  (minimality / accuracy / relevance for lambda=2)
#
# Both are built from existing result reports, not from a fresh evaluation run.

[general]
# Unused by these tables but required by load_config (shared schema)
result_path = "data/jiis/results"
output_path = "data/jiis/tables"
num_iterations = 3

# Tables 4a/4b/7 disabled — this config produces Tables 6 and 8 only.
[table3]
enabled = false
test_sizes = []
groups = []

[table4]
enabled = false
leading_diagnoses = []

# Algorithms / KBs unused here but required by the load_config schema.
[[algorithm]]
key = "kbdiag"
display_name = "MSD"
lambda = 1

[[kb]]
name = "REAL-FM-11"
display_name = "HIS"

# ---------------------------------------------------------------------------
# Paper Table 6 — position of MSD's diagnosis within HSD's enumeration
# ---------------------------------------------------------------------------

[table8]
enabled = true
# Source of the per-KB scenario counts
results_dir = "data/jiis/results/1"
# Baseline verify report (cap=10) — provides DELL ranks
verify_baseline = "data/jiis/results-diagnosis-quality/diagnosis-quality-verify.txt"
# cap=130 verify report — provides B2C + Win8 ranks
verify_mismatches = "data/jiis/results-diagnosis-quality/diagnosis-quality-verify-mismatches.txt"

[[table8.kb]]
name = "REAL-FM-11"
display_name = "HIS"

[[table8.kb]]
name = "DELL"
display_name = "DELL"

[[table8.kb]]
name = "REAL-FM-4"
display_name = "B2C"

[[table8.kb]]
name = "windows8"
display_name = "Win8"

[[table8.kb]]
name = "CNNl"
display_name = "CNN"

[[table8.kb]]
name = "linux"
display_name = "Linux"

# ---------------------------------------------------------------------------
# Paper Table 8 — cognitive-load metrics for lambda=2
# ---------------------------------------------------------------------------

[table9]
enabled = true
compare_m_report = "data/jiis/results-cognitive/compare-kbdiag-m.txt"
overhead_report  = "data/jiis/results-cognitive/verify-m2-overhead.txt"
test_sizes = [5, 10, 25, 50, 100, 250, 500]
