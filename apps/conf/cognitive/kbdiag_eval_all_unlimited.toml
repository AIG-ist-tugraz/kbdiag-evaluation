# KBDiag task=all UNLIMITED for Phase 4 overhead verification
# Usage: python -m apps.eval_runner apps/conf/cognitive/kbdiag_eval_all_unlimited.toml
#
# Re-runs KBDiag all-diagnoses without cap (was cap=10 in Feb 24 data).
# 1 iteration only — we need diagnosis sets, not timing benchmarks.
# Profiler disabled to speed up runs.

[evaluation]
algorithm = "kbdiag"
task = "all"
# No max_diagnoses → unlimited enumeration
num_iterations = 1
m = 1
dry_run = false
timeout = 0
timeout_all = 1200

[solver]
solver_name = "glucose3"
use_incremental = true

[profiler]
enabled = false

[output]
result_path = "data/jiis/results-cognitive_1"

[[kb]]
name = "REAL-FM-11"
model = "data/jiis/fms/REAL-FM-11.uvl"
scenarios_dir = "data/jiis/scenarios"
testcases = [
#    "REAL-FM-11_c5_1.testcases",
#    "REAL-FM-11_c10_1.testcases",
#    "REAL-FM-11_c25_1.testcases",
