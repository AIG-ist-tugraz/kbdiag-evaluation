# Test Cases Selector Configuration
# Usage: python -m apps.testcases_selector apps/conf/testcases_selector.toml

[selection]
num_scenarios = 9
violated_percent = 0.20
cardinalities = [5, 10, 25, 50, 100, 250, 500]
seed = 82  # random seed for reproducibility (remove for non-deterministic)
min_priority_conflicts = 2  # TCs with >= this many conflicts get selected first
selection_strategy = "diversity"  # "random" (legacy) or "diversity" (conflict-fingerprint-based)

[concurrency]
max_workers = 4

[output]
output_dir = "data/jiis/scenarios"

