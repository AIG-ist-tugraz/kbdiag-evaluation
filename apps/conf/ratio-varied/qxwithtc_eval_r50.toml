# Phase 2 (C2) eval — quickxplain_with_testcases — inconsistency ratio 50%
# Usage: python -m apps.eval_runner apps/conf/ratio-varied/qxwithtc_eval_r50.toml
#
# Scope: 3 KBs × 6 cardinalities × 10 versions × 3 iterations = 540 runs

[evaluation]
algorithm = "quickxplain_with_testcases"
task = "1"
num_iterations = 3
dry_run = true
# Total timeout per scenario in seconds, SPLIT EQUALLY across num_iterations.
# E.g. timeout=1200 with num_iterations=3 → 400s per iteration (hard kill).
# Set to 0 to disable timeout (runs inline, no multiprocessing).
timeout = 1200
# Same semantics for task="all" scenarios — overrides timeout when effective_task="all".
timeout_all = 3600  # 3 iterations
# Search strategy: "bfs" (breadth-first, default) or "best_first" (priority queue)
search_strategy = "bfs"
# max_diagnoses irrelevant when task="1" (always cap=1)

[solver]
solver_name = "glucose3"
use_incremental = true

[profiler]
enabled = true
preset = "benchmark"

[output]
# NOTE: eval_runner APPENDS to its output files (open(..., "a")). Re-running
# into a directory that already holds results silently concatenates two runs,
# and the table generators then average across both and produce tables that do
# not match the article. `result_path` therefore points at a *rerun* directory,
# kept separate from the published results shipped with this artifact.
# To regenerate the tables from your own run, point `result_path` in the
# corresponding apps/conf/*_gen.toml at the same rerun directory.
result_path = "data/jiis/results-rerun-ratio/r50"

[[kb]]
name = "REAL-FM-11"
model = "data/jiis/fms/REAL-FM-11.uvl"
scenarios_dir = "data/jiis/scenarios-ratio/r50"
testcases = [
    "REAL-FM-11_c10_1.testcases",
    "REAL-FM-11_c25_1.testcases",
    "REAL-FM-11_c50_1.testcases",
    "REAL-FM-11_c100_1.testcases",
    "REAL-FM-11_c250_1.testcases",
    "REAL-FM-11_c500_1.testcases",
]

[[kb]]
name = "windows8"
model = "data/jiis/fms/windows8.uvl"
scenarios_dir = "data/jiis/scenarios-ratio/r50"
testcases = [
    "windows8_c10_0.testcases",
    "windows8_c25_0.testcases",
    "windows8_c50_0.testcases",
    "windows8_c100_0.testcases",
    "windows8_c250_0.testcases",
    "windows8_c500_0.testcases",
]

[[kb]]
name = "linux"
model = "data/jiis/fms/linux-2.6.33.3.uvl"
scenarios_dir = "data/jiis/scenarios-ratio/r50"
testcases = [
    "linux_c10_1.testcases",
    "linux_c25_1.testcases",
    "linux_c50_1.testcases",
    "linux_c100_1.testcases",
    "linux_c250_1.testcases",
    "linux_c500_1.testcases",
]

[email]
# Off by default: the runner otherwise warns about missing credentials
# at the end of every run. Set to true and provide a .env (see .env.example)
# if you want a completion notification.
enabled = false
subject_prefix = "[HSDAG]"
