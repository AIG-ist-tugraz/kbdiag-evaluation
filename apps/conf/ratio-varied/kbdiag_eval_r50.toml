# Phase 2 (C2) eval — kbdiag — inconsistency ratio 50%
# Usage: python -m apps.eval_runner apps/conf/ratio-varied/kbdiag_eval_r50.toml
#
# Scope: 3 KBs × 6 cardinalities × 10 versions × 1 iterations = 180 runs

[evaluation]
algorithm = "kbdiag"
task = "1"
num_iterations = 3
m = 1
dry_run = true
# Total timeout per scenario in seconds, SPLIT EQUALLY across num_iterations.
# E.g. timeout=1200 with num_iterations=3 → 400s per iteration (hard kill).
# Set to 0 to disable timeout (runs inline, no multiprocessing).
timeout = 1200
# max_diagnoses irrelevant when task="1" (always cap=1)
# Same semantics for task="all" scenarios — overrides timeout when effective_task="all".
timeout_all = 3600  # 3 iterations

[solver]
solver_name = "glucose3"
use_incremental = true

[profiler]
enabled = true
preset = "benchmark"

[output]
result_path = "data/jiis/results-ratio/r50"

[[kb]]
name = "REAL-FM-11"
model = "data/jiis/fms/REAL-FM-11.uvl"
scenarios_dir = "data/jiis/scenarios-ratio/r50"
testcases = [
    "REAL-FM-11_c10_1.testcases",
    "REAL-FM-11_c25_1.testcases",
    "REAL-FM-11_c50_1.testcases",
    "REAL-FM-11_c100_1.testcases",
    "REAL-FM-11_c250_1.testcases",
    "REAL-FM-11_c500_1.testcases",
]

