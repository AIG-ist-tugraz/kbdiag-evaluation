# QuickXPlainWithTestCases+HSDAG Evaluation Configuration
# Usage: python -m apps.eval_runner apps/conf/qxwithtc_eval.toml

[evaluation]
# Algorithm: kbdiag, quickxplain_with_testcases
algorithm = "quickxplain_with_testcases"
# Task: "1" (one diagnosis) or "all" (all diagnoses)
task = "1"
# Number of iterations per test case file
num_iterations = 3
# m parameter (unused by quickxplain_with_testcases, kept for config compatibility)
m = 1
# Run warmup iteration before measurement
dry_run = true
# Timeout per scenario in seconds (0 = no timeout)
timeout = 3600
# Timeout for task="all" scenarios (overrides timeout when effective_task="all" - 0 means no timeout)
timeout_all = 5400

[solver]
solver_name = "glucose3"
use_incremental = false

[profiler]
enabled = true
preset = "benchmark"  # "benchmark" or "disabled"

[output]
result_path = "data/jiis/results"

# Knowledge bases to evaluate

[[kb]]
name = "DELL"
model = "data/jiis/fms/DELL.uvl"
scenarios_dir = "data/jiis/scenarios"
testcases = [
    "DELL_c5_3.testcases",
    "DELL_c10_3.testcases",
    "DELL_c25_3.testcases",
    "DELL_c50_3.testcases",
    "DELL_c100_3.testcases",
    "DELL_c250_3.testcases",
    "DELL_c500_3.testcases",
]
# Per-testcase task override (optional, fnmatch glob patterns)
# First matching pattern wins. Unmatched files use [evaluation].task.
[kb.task_overrides]
"*_c25_*" = "all"

