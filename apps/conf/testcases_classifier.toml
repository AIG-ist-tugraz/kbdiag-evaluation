# TestCases Classifier Configuration
# Usage: python -m apps.testcases_classifier apps/conf/testcases_classifier.toml

[classification]
max_conflict_sets = 3

[solver]
solver_name = "glucose3"

[output]
output_dir = "data/jiis/classifiedTS"

# Feature models with their test suites
[[fm]]
name = "DELL"
model = "data/jiis/fms/DELL.uvl"
testsuite = "data/jiis/testsuite/DELL.testsuite"

