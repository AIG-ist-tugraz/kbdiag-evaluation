# Paper Table 5 — runtime speedup across inconsistency ratios
# Usage: python -m apps.results_table_gen apps/conf/table5_gen.toml
#
# The internal section is named [table7] and predates the final paper
# numbering; it produces paper Table 5. Speedup = HSDAG_time / KBDiag_time
# at 4 inconsistency ratios x 6 cardinalities, for HIS, Win8 and Linux.
# The r20 column reuses the default-ratio results in data/jiis/results.

[general]
# Unused by this table but required by load_config (shared schema)
result_path = "data/jiis/results"
output_path = "data/jiis/tables"
num_iterations = 3

# Tables 4a/4b/7 disabled — this config produces Table 5 only
[table3]
enabled = false
test_sizes = []
groups = []

[table4]
enabled = false
leading_diagnoses = []

# Algorithms not used directly here (looked up internally), but kept so the
# load_config schema is satisfied
[[algorithm]]
key = "quickxplain_with_testcases"
display_name = "HSD"

[[algorithm]]
key = "kbdiag"
display_name = "MSD"
lambda = 1

# Placeholder top-level [[kb]] — this table uses its own [[table7.kb]] below
[[kb]]
name = "REAL-FM-11"
display_name = "HIS"

# ---------------------------------------------------------------------------
# Paper Table 5
# ---------------------------------------------------------------------------

[table7]
enabled = true
cardinalities = [10, 25, 50, 100, 250, 500]

# Ratio -> result root. r20 reuses the default-ratio scenarios.
[table7.result_paths]
r10 = "data/jiis/results-ratio/r10"
r20 = "data/jiis/results"
r30 = "data/jiis/results-ratio/r30"
r50 = "data/jiis/results-ratio/r50"

# Per-KB config. version_suffix = filename version index (e.g., REAL-FM-11_c100_<X>).
# Required because linux has both _0 and _1 — one must be picked for cross-ratio
# comparability. The r10/r30/r50 runs only have one version, matching these suffixes.
[[table7.kb]]
name = "REAL-FM-11"
display_name = "HIS"
num_constraints = 64
version_suffix = 1

[[table7.kb]]
name = "windows8"
display_name = "Win8"
num_constraints = 405
version_suffix = 0

[[table7.kb]]
name = "linux"
display_name = "Linux"
num_constraints = 13972
version_suffix = 1
